<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>painterly-sky</title>
<style>
html,body{margin:0;background:#f3ecdf;color:#15130f;font:500 clamp(1rem,1.5vw,1.35rem)/1.4 system-ui,sans-serif}
.hero{position:relative;isolation:isolate;overflow:clip;min-height:100svh;padding:12vh 5vw 30vh;box-sizing:border-box}
.scene{position:absolute;inset:0;z-index:-1;pointer-events:none}
.meadow-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-title{margin:0;font:900 clamp(4rem,15vw,15rem)/.85 Impact,'Arial Black',sans-serif;text-transform:uppercase}
.hero-title .line{display:block}
.lede{max-width:34ch;margin:2rem 0}
.cta-row{display:flex;gap:1.2rem;align-items:center}
.source{color:inherit}
.sun-hint{position:absolute;font:600 .75rem ui-monospace,monospace;text-transform:uppercase;opacity:0;pointer-events:none}
/* legibility: library sets data-tone=light|dark and --halo (0..1) */
.hero [data-tone]{color:#15130f;--halo-rgb:243 236 223;
 text-shadow:0 0 1px rgb(var(--halo-rgb)/var(--halo,0)),0 0 2px rgb(var(--halo-rgb)/var(--halo,0)),0 0 3px rgb(var(--halo-rgb)/calc(var(--halo,0)*.7));transition:color .5s}
.hero [data-tone=dark]{color:#fff8e8;--halo-rgb:18 16 26}
</style>
<section class=hero data-meadow>
  <div class=scene aria-hidden=true><canvas class=meadow-canvas data-meadow-canvas></canvas></div>
  <span class=sun-hint data-sun-hint>Drag the sun</span>
  <div class=hero-text>
    <h1 class=hero-title><span class=line><span>Touch</span></span> <span class=line><span>grass.</span></span></h1>
    <p class=lede>A painted, procedural meadow in WebGL2. Move the mouse, click, drag the sun.</p>
    <div class=cta-row><a class=source href="https://github.com/isjiajia01/painterly-sky">Read the source</a></div>
  </div>
</section>
<script type=module>
import { createPainterlySky } from './dist/painterly-sky.js';
createPainterlySky({ hero: document.querySelector('[data-meadow]') });
</script>
