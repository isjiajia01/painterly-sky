<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>painterly-sky</title>
<style>html,body{margin:0;height:100%}canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
main{position:relative;z-index:1;padding:12vh 5vw;pointer-events:none}
h1{margin:0;font:900 14vw/0.85 Impact,'Arial Black',sans-serif;transition:color .6s}
p{font:500 1.4rem/1.4 system-ui;max-width:30ch;margin:2rem 0;transition:color .6s}
[data-tone=light]{color:#15130f}[data-tone=dark]{color:#fff8e8}
</style>
<canvas id=c></canvas><main><h1 id=t>TOUCH<br>GRASS.</h1><p id=l>Procedural painted gradients in WebGL2. Click anywhere. Move the mouse.</p></main>
<script type=module>import {createPainterlySky} from './painterly-sky.js';
createPainterlySky(document.getElementById('c'),{toneTargets:[t,l], sunrise: !location.search.includes('still'), particles: !location.search.includes('still')});</script>
